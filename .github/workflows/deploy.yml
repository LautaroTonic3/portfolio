# Publica el sitio en GitHub Pages en cada push a main.
# 1) Sube el proyecto a un repo de GitHub.
# 2) En el repo: Settings → Pages → Source: "GitHub Actions".
# 3) Haz push a main. Listo.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Si el repo se llama <usuario>.github.io el sitio vive en la raíz;
      # si no, vive en /<nombre-del-repo>/ y hay que avisarle a Next.
      - name: Calcular base path
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then echo "BASE_PATH=" >> $GITHUB_ENV; else echo "BASE_PATH=/$REPO" >> $GITHUB_ENV; fi
      - run: npm run export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
